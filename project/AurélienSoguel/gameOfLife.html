<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game of Life | Creative Coding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>

<body class="project-page">
  <div class="space-bg" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="index.html">AS / Creative Coding</a>
    <a class="back-link" href="index.html#projects">Back to projects</a>
  </header>
  <main class="project-shell">
    <section class="project-intro">
      <div>
        <p class="eyebrow">Module 04</p>
        <h1>Game of Life</h1>
      </div>
      <div class="project-meta">
        <strong>File</strong>
        <span>gameOfLife.js</span>
        <p>Cellular simulation and emerging forms inside a grid.</p>
      </div>
    </section>
    <section class="sketch-zone">
      <h2>Launch zone</h2>
      <div class="sketch-controls" aria-label="Generation speed controls">

      </div>
      <div id="bomb-countdown" class="bomb-countdown">Bomb: --</div>
      <div id="game-of-life-canvas" class="sketch-container"></div>
    </section>
  </main>
  <script src="gameOfLife.js"></script>
